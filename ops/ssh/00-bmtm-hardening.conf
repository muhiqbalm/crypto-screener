# /etc/ssh/sshd_config.d/00-bmtm-hardening.conf
# "00-" sorts before 50-cloud-init.conf: sshd keeps the FIRST value it reads.
# Install ONLY after key-based root login has been verified (see vps-hardening.sh ssh).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
