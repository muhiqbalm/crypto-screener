# /etc/nginx/sites-available/bmtm-trade.duckdns.org  (installed by ops/vps-hardening.sh nginx)
#
# Differences vs. the 2026-11-10 production file:
#   + security headers, server_tokens off, X-Powered-By hidden
#   + explicit 1 MB body cap
#   + per-IP rate limits on /api/ and /trading/ and a strict one on auth
#   + /api/v1/debug/ is not reachable from the internet (use an SSH tunnel)
#   = /webhook/tradingview block is byte-for-byte the production one:
#     NO rate limit, NO header changes that could slow or reject TradingView.

server {
    server_name bmtm-trade.duckdns.org;

    include /etc/nginx/snippets/bmtm-security-headers.conf;
    client_max_body_size 1m;

    location = /webhook/tradingview {
        proxy_pass http://127.0.0.1:8000/webhook/tradingview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Debug endpoints proxy uncached Binance calls from the live-trading IP.
    location /api/v1/debug/ {
        return 404;
    }

    location /api/ {
        limit_req zone=bmtm_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /trading/auth/register {
        default_type application/json;
        return 403 '{"detail":"Pendaftaran ditutup. BMTM khusus undangan, hubungi admin."}';
    }

    location = /register {
        return 302 /login;
    }

    # Brute-force budget: 10/min per IP with a small burst (the app also
    # enforces 10 per 5 min per IP on POSTs).
    location ~ ^/trading/auth/(login|refresh)$ {
        limit_req zone=bmtm_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /trading/ {
        limit_req zone=bmtm_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000/trading/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bmtm-trade.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bmtm-trade.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = bmtm-trade.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name bmtm-trade.duckdns.org;
    return 404; # managed by Certbot
}
