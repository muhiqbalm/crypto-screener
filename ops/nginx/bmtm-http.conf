# /etc/nginx/conf.d/bmtm-http.conf  (http{} context, installed by ops/vps-hardening.sh)
server_tokens off;

# Per-client-IP request budgets. $binary_remote_addr is the real peer: nginx
# is the edge, nothing sits in front of it.
limit_req_zone $binary_remote_addr zone=bmtm_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bmtm_api:10m  rate=30r/s;
limit_req_status 429;
limit_req_log_level warn;

# Webhook timing (audit 2026-11-13 P1): TradingView cuts the call at 3 s.
# No request body or query string is logged (the payload holds the passphrase).
log_format bmtm_webhook escape=json "$time_iso8601 ip=$remote_addr status=$status rt=$request_time urt=$upstream_response_time ust=$upstream_status bytes=$body_bytes_sent ua=\"$http_user_agent\"";
