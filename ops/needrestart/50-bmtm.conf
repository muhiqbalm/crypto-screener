# /etc/needrestart/conf.d/50-bmtm.conf
# Ubuntu 24.04 needrestart restarts services automatically after library
# upgrades (unattended-upgrades included). pm2-root.service owns bmtm-api, so an
# automatic restart would interrupt the live TradingView webhook at a random
# time. List only; restart manually in a quiet window.
$nrconf{restart} = 'l';
$nrconf{override_rc}{qr(^pm2-)} = 0;
